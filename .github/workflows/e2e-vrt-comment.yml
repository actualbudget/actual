name: VRT Comment
# This workflow posts VRT failure comments on PRs, including fork PRs.
# It runs with elevated permissions via workflow_run trigger.
on:
  # workflow_run is needed to get a token that can comment on fork PRs.
  # This job uses GitHub API records to decide where and what to comment.
  # It never downloads artifacts or checks out PR-supplied code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ['E2E Tests']
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Post VRT Comment
    runs-on: depot-ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Resolve PR and VRT failure report
        id: report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...repo,
              run_id: run.id,
              attempt_number: run.run_attempt,
            });
            if (!jobs.some(job => /^Visual regression \(shard \d+\/\d+\)$/.test(job.name) &&
              job.conclusion === 'failure')) return;

            const name = `html-report--attempt-${run.run_attempt}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...repo,
              run_id: run.id,
              name,
            });
            const reports = artifacts.filter(artifact => artifact.name === name && !artifact.expired);
            if (reports.length !== 1) return;

            if (!run.head_repository || !run.head_branch) return;
            const baseRepoId = context.payload.repository.id;
            const sameSource = pr => pr.base.repo?.id === baseRepoId &&
              pr.head.repo?.id === run.head_repository.id && pr.head.ref === run.head_branch;

            let candidates = run.pull_requests;
            // GitHub can omit the PR association for forks. Include closed PRs and
            // check uniqueness before testing the SHA: another PR may have moved on.
            if (candidates.length === 0) {
              const pulls = await github.paginate(github.rest.pulls.list, {
                ...repo,
                state: 'all',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
              });
              candidates = pulls.filter(pr => sameSource(pr) && pr.created_at <= run.created_at);
            }

            const [pr] = candidates;
            if (candidates.length !== 1 || !sameSource(pr) || pr.head.sha !== run.head_sha) {
              core.info('Cannot tie the triggering run to a single PR at the tested commit; skipping.');
              return;
            }

            core.setOutput('pr_number', pr.number);
            core.setOutput('artifact_url',
              `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${run.id}/artifacts/${reports[0].id}`);
      - name: Comment on PR with VRT report link
        if: steps.report.outputs.pr_number != ''
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          number: ${{ steps.report.outputs.pr_number }}
          header: vrt-comment
          hide_and_recreate: true
          hide_classify: OUTDATED
          message: |
            <!-- vrt-comment -->
            VRT tests ❌ failed. [View the test report](${{ steps.report.outputs.artifact_url }}).

            To update the VRT screenshots, comment `/update-vrt` on this PR. The VRT update operation takes about 10 to 15 minutes.
