name: Cut release branch

on:
  schedule:
    # 17:00 UTC on the 25th of each month
    - cron: '0 17 25 * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the release (optional)'
        required: false
        default: ''
      release-date:
        description: 'Expected release date, YYYY-MM-DD (optional)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  cut-release-branch:
    if: github.repository_owner == 'actualbudget'
    runs-on: depot-ubuntu-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          # Avoid restoring potentially poisoned caches in release jobs.
          cache: 'false'
          download-translations: 'false'

      - name: Determine target version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          args=(--package-json ./packages/desktop-client/package.json --type auto)
          if [[ -n "$INPUT_VERSION" ]]; then
            args+=(--version "$INPUT_VERSION")
          fi
          yarn workspace @actual-app/ci-actions tsx bin/get-next-package-version.ts "${args[@]}"

      - name: Determine previous tag
        id: prev_tag
        run: |
          prev_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null) || prev_tag=""
          echo "tag=${prev_tag:-master}" >> "$GITHUB_OUTPUT"

      - name: Compute release date
        id: release_date
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs['release-date'] }}
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            echo "date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            # default to the 1st of next month
            echo "date=$(date -d '+1 month' '+%Y-%m-01')" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate target version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TYPE: ${{ steps.version.outputs.type }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/branches/release" --silent >/dev/null 2>&1; then
            current_version=$(gh api "repos/${GITHUB_REPOSITORY}/contents/packages/desktop-client/package.json?ref=release" --jq '.content' | base64 -d | jq -r .version)
            latest=$(printf '%s\n%s\n' "$VERSION" "$current_version" | sort -V | tail -1)
            if [[ "$latest" != "$VERSION" || "$current_version" == "$VERSION" ]]; then
              echo "::error::Target version $VERSION is not newer than current release version $current_version"
              exit 1
            fi
          fi

          echo "Type: $TYPE (target=$VERSION, current=${current_version:-none})"

      - name: Apply version bumps
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for pkg in desktop-client desktop-electron sync-server api cli loot-core mobile-client; do
            yarn workspace @actual-app/ci-actions tsx bin/get-next-package-version.ts \
              --package-json "./packages/$pkg/package.json" \
              --version "$VERSION" \
              --update
          done

      - name: Open release-notes branch and PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: '🔖 (${{ steps.version.outputs.version }})'
          title: '🔖 (${{ steps.version.outputs.version }})'
          body: |
            Generated by [cut-release-branch.yml](../tree/master/.github/workflows/cut-release-branch.yml)

            Release branch: [`release`](../compare/${{ steps.prev_tag.outputs.tag }}...release)

            <!-- release-date:${{ steps.release_date.outputs.date }} -->
          branch: 'release-notes/${{ steps.version.outputs.version }}'
          base: master

      - name: Open release branch update PR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TYPE: ${{ steps.version.outputs.type }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin "release-notes/$VERSION"
          bump_commit=$(git rev-parse FETCH_HEAD)

          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/release" --silent >/dev/null 2>&1; then
            # No release branch yet: create it directly from the bump commit.
            git push origin "$bump_commit:refs/heads/release"
            exit 0
          fi

          git fetch origin master release
          branch="release-update/$VERSION"

          if [[ "$TYPE" == "monthly" ]]; then
            # Take master + version bump wholesale. `-s ours` records release
            # as merged without attempting any content merge, so divergent
            # histories (including modify/delete) can never conflict.
            git checkout -B "$branch" "$bump_commit"
            git merge -s ours --no-edit origin/release
            git diff --exit-code "$bump_commit"
          else
            git checkout -B "$branch" origin/release

            # Drop release notes already shipped by a previous release: the
            # release-notes PR deletes them from master but not from release,
            # and a hotfix must not compile them into its changelog again.
            stale=$(comm -23 \
              <(git ls-tree -r --name-only origin/release upcoming-release-notes/ | sort) \
              <(git ls-tree -r --name-only origin/master upcoming-release-notes/ | sort))
            if [[ -n "$stale" ]]; then
              echo "$stale" | xargs git rm -q --
              git commit -m '🔖 remove release notes shipped in previous releases'
            fi

            git cherry-pick "$bump_commit"
          fi

          git push --force origin "HEAD:refs/heads/$branch"

          open_prs=$(gh pr list --head "$branch" --base release --state open --json number --jq 'length')
          if [[ "$open_prs" == "0" ]]; then
            {
              echo "Generated by [cut-release-branch.yml](../tree/master/.github/workflows/cut-release-branch.yml)"
              echo
              echo "Merging this PR updates the \`release\` branch for ${VERSION}. Release-note generation runs automatically once it is merged."
            } > "$RUNNER_TEMP/release-pr-body.md"

            gh pr create \
              --base release \
              --head "$branch" \
              --title "🔖 update release branch (${VERSION})" \
              --body-file "$RUNNER_TEMP/release-pr-body.md"
          fi
