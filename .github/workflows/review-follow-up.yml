name: Follow up on reviewed PRs

# When a maintainer reviews a PR without approving it, the author gets 7 days
# to respond. After that a reminder is posted, and if there is still no
# response 3 days later the PR is closed.
# See .github/scripts/review-follow-up.mjs for the details.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only log what would happen, without commenting or closing'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: review-follow-up
  cancel-in-progress: false

jobs:
  review-follow-up:
    permissions:
      contents: read
      pull-requests: write
    runs-on: depot-ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Follow up on reviewed PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry-run || false }}
        with:
          script: |
            const { run } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/review-follow-up.mjs`
            );
            await run({
              github,
              context,
              core,
              dryRun: process.env.DRY_RUN === 'true',
            });
