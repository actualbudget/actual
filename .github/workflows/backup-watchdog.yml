name: Production Backup Watchdog

on:
  schedule:
    - cron: '17 4,5 * * *'

permissions:
  actions: read

jobs:
  check-backup:
    name: Check for today's production backup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check scheduled run time
        id: schedule
        run: |
          local_time=$(TZ=Europe/Budapest date +'%H%M')
          if [[ "$local_time" > "0616" && "$local_time" < "0700" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping non-matching UTC schedule occurrence (local time: $local_time)"
          fi

      - name: Check for a successful scheduled backup today
        if: steps.schedule.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Europe/Budapest date +'%F')
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/backup.yml/runs?event=schedule&branch=master&per_page=100")
          run_rows=$(jq -r '.workflow_runs[]? | [.id, .created_at] | @tsv' <<< "$runs")

          while IFS=$'\t' read -r run_id created_at; do
            [[ -n "$run_id" ]] || continue
            run_date=$(TZ=Europe/Budapest date --date="$created_at" +'%F')
            [[ "$run_date" == "$today" ]] || continue

            jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs")
            if jq -e 'any(.jobs[]?; .name == "Run production backup" and any(.steps[]?; .name == "Run and verify production backup" and .conclusion == "success"))' <<< "$jobs" > /dev/null; then
              echo "A successful production backup was completed today ($today Budapest time)."
              exit 0
            fi
          done <<< "$run_rows"

          echo "::error::No successful production backup was found for $today (Budapest time)."
          exit 1
